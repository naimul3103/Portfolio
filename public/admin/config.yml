# ─────────────────────────────────────────────────────────────────────────────
# The CMS contract. Every widget here mirrors a zod schema in
# src/content.config.ts or src/schemas/config.ts. Change one, change all three:
# schema + this file + docs/CONTENT-MODEL.md (they are one contract, three views).
#
# Before first use, replace:
#   <auth-worker>  → the sveltia-cms-auth Worker URL (docs/CMS.md §1)
#   <account-id>   → Cloudflare account id
#   <access-key-id>→ R2 access key id (the NON-secret half; the secret is entered
#                    once in the CMS UI and stored in the browser, never here)
# ─────────────────────────────────────────────────────────────────────────────
backend:
  name: github
  repo: naimul3103/Portfolio
  branch: main
  base_url: https://<auth-worker>.workers.dev

# Every save becomes a draft pull request. Nothing reaches main without a merge.
publish_mode: editorial_workflow
site_url: https://naimul3103.pages.dev
display_url: https://naimul3103.pages.dev
logo_url: https://naimul3103.pages.dev/favicon.svg
locale: en

media_libraries:
  cloudflare_r2:
    access_key_id: <access-key-id>
    bucket: portfolio-media
    account_id: <account-id>
    public_url: https://pub-<hash>.r2.dev
    prefix: cms-uploads/

collections:
  # ── Long-form content ──────────────────────────────────────────────────────
  - name: blog
    label: Writing
    label_singular: Post
    folder: content/blog
    extension: mdx
    format: frontmatter
    create: true
    slug: "{{slug}}"
    preview_path: blog/{{slug}}
    summary: "{{title}} — {{pubDate}}"
    sortable_fields: [pubDate, title]
    fields:
      - { name: title, label: Title, widget: string, maxlength: 110 }
      - {
          name: description,
          label: Description,
          widget: text,
          maxlength: 180,
          hint: "Used for the card, meta description and RSS.",
        }
      - {
          name: pubDate,
          label: Published,
          widget: datetime,
          date_format: "YYYY-MM-DD",
          time_format: false,
        }
      - {
          name: updated,
          label: Updated,
          widget: datetime,
          date_format: "YYYY-MM-DD",
          time_format: false,
          required: false,
        }
      - {
          name: category,
          label: Category,
          widget: select,
          options: [technical, learning-journey, book-review, notes],
        }
      - { name: tags, label: Tags, widget: list, default: [], required: false }
      - { name: draft, label: Draft, widget: boolean, default: false }
      - {
          name: aiGenerated,
          label: AI-assisted,
          widget: boolean,
          default: false,
          hint: "Adds a visible disclosure to the post.",
        }
      - { name: comments, label: Comments, widget: select, options: [on, off], default: on }
      - {
          name: cover,
          label: Cover image,
          widget: image,
          required: false,
          media_library: { name: cloudflare_r2 },
        }
      - {
          name: coverAlt,
          label: Cover alt text,
          widget: string,
          required: false,
          hint: "Required if there is a cover.",
        }
      - { name: body, label: Body, widget: markdown }

  - name: notes
    label: Notes
    label_singular: Note
    folder: content/notes
    extension: md
    format: frontmatter
    create: true
    slug: "{{slug}}"
    preview_path: notes/{{slug}}
    summary: "{{title}} — {{status}}"
    fields:
      - { name: title, label: Title, widget: string, maxlength: 110 }
      - { name: description, label: Description, widget: text, maxlength: 220 }
      - {
          name: pubDate,
          label: Date,
          widget: datetime,
          date_format: "YYYY-MM-DD",
          time_format: false,
        }
      - {
          name: updated,
          label: Updated,
          widget: datetime,
          date_format: "YYYY-MM-DD",
          time_format: false,
          required: false,
        }
      - { name: status, label: Status, widget: select, options: [seedling, growing, evergreen] }
      - { name: tags, label: Tags, widget: list, min: 1 }
      - { name: draft, label: Draft, widget: boolean, default: false }
      - { name: body, label: Body, widget: markdown }

  - name: projects
    label: Projects
    label_singular: Project
    folder: content/projects
    extension: md
    format: frontmatter
    create: true
    slug: "{{slug}}"
    preview_path: projects/{{slug}}
    summary: "{{title}} — {{status}}"
    sortable_fields: [order, pubDate, title]
    fields:
      - { name: title, label: Title, widget: string, maxlength: 110 }
      - { name: description, label: One-line description, widget: text, maxlength: 180 }
      - {
          name: pubDate,
          label: Start / publish date,
          widget: datetime,
          date_format: "YYYY-MM-DD",
          time_format: false,
        }
      - {
          name: updated,
          label: Updated,
          widget: datetime,
          date_format: "YYYY-MM-DD",
          time_format: false,
          required: false,
        }
      - {
          name: category,
          label: Category,
          widget: select,
          options: [personal, university, open-source],
        }
      - { name: stack, label: Stack, widget: list, min: 1 }
      - { name: status, label: Status, widget: select, options: [live, wip, archived] }
      - { name: order, label: Order, widget: number, required: false, value_type: int }
      - { name: repoUrl, label: Repository URL, widget: string, required: false }
      - { name: demoUrl, label: Live demo URL, widget: string, required: false }
      - { name: docsUrl, label: Docs URL, widget: string, required: false }
      - name: outcomes
        label: Outcomes
        label_singular: Outcome
        widget: list
        min: 1
        hint: "A claim without a metric and a method does not build."
        fields:
          - { name: claim, label: Claim, widget: string }
          - { name: metric, label: Metric, widget: string, hint: "A number, not an adjective." }
          - { name: method, label: Method, widget: string, hint: "Tool, sample, baseline." }
      - { name: evidence, label: Evidence links, widget: list, required: false }
      - {
          name: whatIdDoDifferently,
          label: What I would do differently,
          widget: text,
          minlength: 80,
          hint: "At least 80 characters. The build enforces it.",
        }
      - {
          name: cover,
          label: Cover image,
          widget: image,
          required: false,
          media_library: { name: cloudflare_r2 },
        }
      - { name: coverAlt, label: Cover alt text, widget: string, required: false }
      - { name: body, label: Case study, widget: markdown }

  - name: photos
    label: Gallery
    label_singular: Photo
    folder: content/photos
    extension: md
    format: frontmatter
    create: true
    slug: "{{slug}}"
    summary: "{{title}} — {{date}}"
    fields:
      - { name: title, label: Title, widget: string }
      - {
          name: date,
          label: Date taken,
          widget: datetime,
          date_format: "YYYY-MM-DD",
          time_format: false,
        }
      - { name: image, label: Image, widget: image, media_library: { name: cloudflare_r2 } }
      - {
          name: alt,
          label: Alt text,
          widget: string,
          minlength: 10,
          hint: "Describe the photo, not its filename.",
        }
      - {
          name: collection,
          label: Collection,
          widget: select,
          options: [travel, nature, urban, other],
        }
      - name: exif
        label: EXIF
        widget: object
        required: false
        fields:
          - { name: camera, label: Camera, widget: string, required: false }
          - { name: lens, label: Lens, widget: string, required: false }
          - { name: settings, label: Settings, widget: string, required: false }
      - {
          name: location,
          label: Location,
          widget: string,
          required: false,
          hint: "City level only.",
        }
      - { name: draft, label: Draft, widget: boolean, default: false }
      - { name: body, label: Story, widget: markdown, required: false }

  # ── Spreadsheet-shaped lists ───────────────────────────────────────────────
  - name: reading_list
    label: Reading list
    files:
      - name: books
        label: Books
        file: content/reading-list.yaml
        fields:
          - name: books
            label: Books
            widget: list
            fields:
              - { name: title, label: Title, widget: string }
              - { name: author, label: Author, widget: string }
              - {
                  name: status,
                  label: Status,
                  widget: select,
                  options: [reading, finished, want-to-read],
                }
              - {
                  name: rating,
                  label: Rating,
                  widget: number,
                  required: false,
                  value_type: int,
                  min: 1,
                  max: 5,
                }
              - { name: review, label: Note, widget: text, required: false }
              - { name: coverUrl, label: Cover URL, widget: string, required: false }
              - { name: tags, label: Tags, widget: list, required: false }
              - {
                  name: started,
                  label: Started,
                  widget: datetime,
                  required: false,
                  date_format: "YYYY-MM-DD",
                  time_format: false,
                }

  - name: anime
    label: Screen time
    files:
      - name: anime
        label: Anime
        file: content/anime.yaml
        fields:
          - name: anime
            label: Anime
            widget: list
            fields:
              - { name: title, label: Title, widget: string }
              - { name: studio, label: Studio, widget: string, required: false }
              - { name: year, label: Year, widget: number, required: false, value_type: int }
              - {
                  name: status,
                  label: Status,
                  widget: select,
                  options: [watching, finished, want-to-watch],
                }
              - {
                  name: rating,
                  label: Rating,
                  widget: number,
                  required: false,
                  value_type: int,
                  min: 1,
                  max: 5,
                }
              - { name: thoughts, label: One-liner, widget: string, required: false }

